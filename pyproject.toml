[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version", "dependencies"]
name="HyperCP"
requires-python = "> 3.10"

[tool.setuptools]
py-modules = []

[tool.setuptools.dynamic]
dependencies= { file = ["requirements.txt"] }

[project.optional-dependencies]
gui=["PyQt5"]
